[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yokogawa-cv8000-compiler"
version = "0.1.0"
description = "Process output data from Yokogawa Cell Voyager CV8000"
readme = "README.md"
requires-python = ">=3.7"
license = {text = "MIT"}
dependencies = [
    "numpy",
    "pandas",
    "tifffile",
    "xmltodict"
]

[project.scripts]
compile-cv8000 = "yokogawa_compiler.compile:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"