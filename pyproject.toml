[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yokogawa-cv8000-utils"
version = "0.2.0"
description = "Process output data from Yokogawa Cell Voyager CV8000"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "dask",
    "imagecodecs>=2025.3.30",
    "matplotlib>=3.10.9",
    "numpy",
    "pandas",
    "pydantic>=2",
    "scikit-image>=0.25.2",
    "scipy>=1.15.3",
    "tifffile",
    "tqdm",
    "typer",
    "xarray",
    "xmltodict",
]

[project.optional-dependencies]
zarr = [
    "zarr>=2.17,<3",
    "ome-zarr>=0.9,<0.11",
    "numcodecs>=0.12,<0.14",
]
video = [
    "imageio-ffmpeg>=0.4",
]

[project.scripts]
compile-cv8000 = "compiler.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
