services:
  gradio:
    build: ./web
    restart: unless-stopped
    env_file: .env
    environment:
      - UPLOAD_ROOT=/data/upload
      - UPLOAD_ROOT_DISPLAY=${UPLOAD_ROOT:-/volume1/upload}
    volumes:
      - ${UPLOAD_ROOT:-/volume1/upload}:/data/upload
    ports:
      - "${GRADIO_PORT:-7860}:7860"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - gradio
